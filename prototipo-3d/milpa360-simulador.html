<style>
:root{
  --void:#07090C; --glass:rgba(14,18,24,.78); --glass-2:rgba(20,26,33,.86);
  --line:rgba(150,175,195,.20); --line-2:rgba(150,175,195,.10);
  --text:#EEF2F6; --text-2:#9FB0BE; --text-3:#66788A;
  --rust:#D2622F; --rust-hi:#F08348;
  --amber:#E9AE52; --cool:#63A9D1; --bio:#7FBB72; --loam:#96633A;
  --sans:Archivo,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --pad:18px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--void);color:var(--text);
  font-family:var(--sans);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
canvas{display:block;touch-action:none}
#lienzo{position:fixed;inset:0;cursor:grab}
#lienzo:active{cursor:grabbing}

/* ───────── tipografía ───────── */
.exp{font-stretch:118%;font-weight:700;letter-spacing:-.012em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{
  font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.19em;
  text-transform:uppercase;color:var(--text-3);
}

/* ───────── cristal ───────── */
.panel{
  background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25);
  box-shadow:0 18px 50px -22px rgba(0,0,0,.95);
}

/* ───────── barra superior ───────── */
#barra{
  position:fixed;top:var(--pad);left:var(--pad);right:var(--pad);height:52px;z-index:20;
  display:flex;align-items:center;gap:16px;padding:0 8px 0 16px;border-radius:2px;
}
#marca{display:flex;align-items:baseline;gap:11px;white-space:nowrap}
#marca b{font-size:16.5px}
#marca span{font-family:var(--mono);font-size:10px;letter-spacing:.15em;color:var(--text-3)}
#vistas{display:flex;gap:2px;margin-left:auto;padding:3px;background:rgba(0,0,0,.35);border-radius:2px}
#vistas button{
  font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.13em;
  color:var(--text-3);background:none;border:none;padding:8px 15px;cursor:pointer;
  transition:color .18s,background .18s;border-radius:1px;
}
#vistas button:hover{color:var(--text-2)}
#vistas button[aria-selected="true"]{color:#150A05;background:var(--rust);font-weight:600}
#vistas button:focus-visible{outline:2px solid var(--rust-hi);outline-offset:1px}

/* ───────── riel lateral ───────── */
#riel{
  position:fixed;left:var(--pad);top:86px;width:310px;max-height:calc(100vh - 190px);z-index:15;
  display:flex;flex-direction:column;border-radius:2px;overflow:hidden;
  transition:transform .32s cubic-bezier(.4,0,.2,1),opacity .22s;
}
#riel.oculto{transform:translateX(calc(-100% - var(--pad)));opacity:0;pointer-events:none}
.riel-cab{
  display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line-2);
}
.riel-cab .eyebrow{flex-grow:1}
.riel-cuerpo{overflow-y:auto;padding:4px 15px 14px;scrollbar-width:thin}
.riel-cuerpo::-webkit-scrollbar{width:5px}
.riel-cuerpo::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

/* telemetría */
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px;
  font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:500;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-3);padding:9px 0 6px;position:sticky;top:0;background:var(--glass)}
td{padding:5px 0;border-top:1px solid var(--line-2);color:var(--text-2)}
td:last-child,th:last-child{text-align:right}
tr.hot td{color:var(--text)}
tr.hot td:first-child{color:var(--rust-hi);font-weight:600}
.pip{display:inline-block;width:7px;height:7px;margin-right:8px;vertical-align:1px;border-radius:50%}
.rest.low{color:var(--rust-hi)}

/* lista de datos del planeta */
.dato{
  width:100%;text-align:left;background:none;border:none;border-top:1px solid var(--line-2);
  padding:11px 0 10px;cursor:pointer;display:flex;gap:11px;align-items:baseline;
  transition:padding-left .18s;
}
.dato:hover,.dato:focus-visible{padding-left:5px;outline:none}
.dato:hover .dv,.dato:focus-visible .dv{color:var(--rust-hi)}
.dato .dk{flex-grow:1;font-size:13px;color:var(--text-2)}
.dato .dv{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--text);
  white-space:nowrap;transition:color .18s}
.dato[data-marca]::after{content:"◉";font-size:9px;color:var(--rust);margin-left:2px}

/* ───────── transporte inferior ───────── */
#transporte{
  position:fixed;bottom:var(--pad);left:50%;transform:translateX(-50%);z-index:20;
  display:flex;align-items:stretch;border-radius:2px;overflow:hidden;
  transition:opacity .25s,transform .25s;
}
#transporte.oculto{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(14px)}
.tr-bloque{display:flex;align-items:center;gap:13px;padding:12px 20px;border-right:1px solid var(--line-2)}
.tr-bloque:last-child{border-right:none}
#reloj{display:flex;align-items:baseline;gap:7px}
#reloj .n{font-family:var(--mono);font-weight:600;font-size:27px;line-height:1;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
#reloj .u{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--text-3)}
#progreso{width:120px;height:2px;background:var(--line-2);position:relative}
#progreso i{position:absolute;inset:0 auto 0 0;background:var(--rust);display:block}
.btn{
  font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.11em;
  color:var(--text-2);background:rgba(255,255,255,.045);border:1px solid var(--line);
  padding:9px 14px;cursor:pointer;transition:.16s;white-space:nowrap;border-radius:1px;
}
.btn:hover{color:var(--text);border-color:var(--text-3);background:rgba(255,255,255,.08)}
.btn:focus-visible{outline:2px solid var(--rust-hi);outline-offset:2px}
.btn.on{background:var(--rust);border-color:var(--rust);color:#150A05}
.btn.tormenta{color:var(--amber);border-color:rgba(233,174,82,.35)}
.btn.tormenta:hover{background:rgba(233,174,82,.12);color:var(--amber)}
.btn.tormenta.on{background:var(--amber);border-color:var(--amber);color:#160E02}

/* ───────── ficha ───────── */
#ficha{
  position:fixed;right:var(--pad);top:86px;width:352px;max-height:calc(100vh - 190px);z-index:18;
  border-radius:2px;overflow:hidden;display:flex;flex-direction:column;
  transition:transform .34s cubic-bezier(.4,0,.2,1),opacity .24s;
}
#ficha.oculto{transform:translateX(calc(100% + var(--pad)));opacity:0;pointer-events:none}
#ficha .cab{padding:16px 18px 13px;border-bottom:1px solid var(--line-2);position:relative}
#ficha h2{font-size:21px;margin:5px 0 0;line-height:1.16;padding-right:26px}
#ficha .cuerpo{padding:15px 18px 18px;overflow-y:auto;scrollbar-width:thin}
#ficha .cuerpo::-webkit-scrollbar{width:5px}
#ficha .cuerpo::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
#ficha p{margin:0 0 14px;font-size:13.5px;line-height:1.62;color:var(--text-2)}
#ficha p b{color:var(--text);font-weight:600}
#ficha dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:7px 16px;
  font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
#ficha dt{color:var(--text-3)}
#ficha dd{margin:0;color:var(--text);text-align:right}
#f-viz{margin:0 0 16px;display:flex;flex-direction:column;gap:12px}
.viz-cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:6px}
.viz-barra{height:9px;background:rgba(255,255,255,.07);display:flex;overflow:hidden;border-radius:1px}
.viz-barra i{display:block;height:100%}
.viz-pie{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;
  color:var(--text-2);margin-top:5px}
.viz-cadena{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.viz-pill{font-family:var(--mono);font-size:11px;font-weight:600;padding:5px 8px;border-radius:2px;
  background:rgba(255,255,255,.06);border:1px solid var(--line-2);white-space:nowrap}
.viz-flecha{color:var(--text-3);font-size:11px}
.viz-rej{display:grid;gap:3px}
.viz-cel{aspect-ratio:1;border-radius:1px;background:rgba(255,255,255,.08)}
.viz-nota{font-size:11.5px;color:var(--text-2);line-height:1.5}
#ficha .fuente{margin:15px 0 0;padding-top:12px;border-top:1px solid var(--line-2);
  font-family:var(--mono);font-size:10px;line-height:1.6;color:var(--text-3);letter-spacing:.03em}
#cerrar{position:absolute;top:13px;right:13px;width:26px;height:26px;padding:0;
  background:none;border:none;color:var(--text-3);font-size:18px;line-height:1;cursor:pointer}
#cerrar:hover{color:var(--text)}

/* ───────── etiquetas 3D ───────── */
#etiquetas{position:fixed;inset:0;z-index:10;pointer-events:none;overflow:hidden}
.eti{
  position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-2);transition:opacity .25s;
  padding:4px 9px;background:rgba(8,11,15,.72);border:1px solid var(--line-2);border-radius:2px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.eti b{color:#fff;font-weight:600}
.eti.punto{
  pointer-events:auto;cursor:pointer;padding:5px 9px;
  background:rgba(10,13,17,.6);border:1px solid var(--line);border-radius:2px;
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);transition:.2s;
}
.eti.punto:hover{border-color:var(--rust);color:#fff;background:rgba(210,98,47,.22)}
.eti.punto::before{
  content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--rust);margin-right:7px;vertical-align:1px;
  box-shadow:0 0 0 3px rgba(210,98,47,.28);
}
.eti.sitio::before{background:var(--bio);box-shadow:0 0 0 3px rgba(127,187,114,.3)}
.eti.sitio:hover{border-color:var(--bio);background:rgba(127,187,114,.2)}

/* ───────── pistas y carga ───────── */
#pista{
  position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:14;
  font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--text-3);pointer-events:none;transition:opacity .5s;text-align:center;
}
#carga{
  position:fixed;inset:0;z-index:60;background:var(--void);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity .6s;
}
#carga.listo{opacity:0;pointer-events:none}
#carga .t{font-size:24px}
#carga .s{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--text-3)}
#carga .barra{width:190px;height:2px;background:var(--line-2);overflow:hidden}
#carga .barra i{display:block;height:100%;width:34%;background:var(--rust);
  animation:desliza 1.15s ease-in-out infinite}
@keyframes desliza{0%{transform:translateX(-100%)}100%{transform:translateX(390%)}}

body.captura #barra,body.captura #riel,body.captura #transporte,
body.captura #ficha,body.captura #etiquetas,body.captura #pista{display:none}

@media (max-width:880px){
  #riel{display:none}
  #ficha{left:var(--pad);right:var(--pad);width:auto;top:auto;bottom:82px;max-height:52vh}
  #ficha.oculto{transform:translateY(calc(100% + 90px))}
  #transporte{left:var(--pad);right:var(--pad);transform:none;overflow-x:auto}
  #transporte.oculto{transform:translateY(14px)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<script>
/* GEOMETRÍA GENERADA por analysis/milpa360_p2.py desde config/milpa360.parameters.json.
   No editar entre los marcadores: se sobrescribe. Ese script es la única fuente de
   radios, áreas, masas y del reloj de misión; aquí no se escribe ninguna cifra a mano. */
/*←P2:GEOM*/
const GEOM = {"casco":{"radio":2.28,"diametro":4.56,"altura":2.2,"cubierta":0.62},"anillo":{"r0":1.58,"r1":2.18,"n":20,"holgura_angular":0.94,"paso_grados":18.0,"sector_grados":16.92,"soles_por_paso":8},"cartucho":{"area":0.33311,"profundidad_sustrato":0.22,"cuerda_exterior":0.6414,"ancho_radial":0.6},"areas":{"cultivo":3.9973,"regeneracion":2.6649,"total":6.6622},"pasillo":{"ancho":0.9,"r_equipos_max":0.68},"mision":{"soles_horizonte":525},"ciclo":{"n_regeneracion":8,"n_cultivo":12}};
/*P2:GEOM→*/

(() => {
"use strict";
const T = THREE, TAU = Math.PI * 2, RAD = Math.PI / 180;
const $ = id => document.getElementById(id);

/* ═══════════════════════════════════════════════════════════════
   PARÁMETROS DE URL — poses reproducibles (ver deck/LEEME.md)
   ?vista=planeta|habitat · ui=0 · piso=0 · sol= · theta= · phi= · dist= · storm=1 · play=0
   ═══════════════════════════════════════════════════════════════ */
const Q = new URLSearchParams(location.search);
const qn = (k, d) => Q.has(k) && !isNaN(parseFloat(Q.get(k))) ? parseFloat(Q.get(k)) : d;
const limpio = Q.get("piso") === "0";
if (Q.get("ui") === "0") document.body.classList.add("captura");

/* ═══════════════════════════════════════════════════════════════
   RUIDO — value noise con envoltura horizontal, para texturas equirectangulares
   ═══════════════════════════════════════════════════════════════ */
function hash(ix, iy, w){
  const x = ((ix % w) + w) % w;
  const n = Math.sin(x * 127.1 + iy * 311.7 + 74.7) * 43758.5453123;
  return n - Math.floor(n);
}
const suave = t => t * t * (3 - 2 * t);
function ruido(x, y, w){
  const ix = Math.floor(x), iy = Math.floor(y), fx = suave(x - ix), fy = suave(y - iy);
  const a = hash(ix, iy, w),     b = hash(ix + 1, iy, w);
  const c = hash(ix, iy + 1, w), d = hash(ix + 1, iy + 1, w);
  return (a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + d * fx) * fy;
}
function fbm(x, y, w, oct, gan){
  let s = 0, a = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++){
    s += a * ruido(x * f, y * f, Math.max(1, Math.round(w * f)));
    norm += a; a *= (gan === undefined ? 0.5 : gan); f *= 2;
  }
  return s / norm;
}
const mezcla = (a, b, t) => a + (b - a) * t;
const sat = v => v < 0 ? 0 : v > 1 ? 1 : v;

/* ═══════════════════════════════════════════════════════════════
   TEXTURAS PROCEDURALES
   ═══════════════════════════════════════════════════════════════ */

/* ═══ SUPERFICIE DE MARTE ═══
   Dos pasadas: el manto de albedo se calcula por píxel a media resolución (suave, no necesita
   más) y encima se dibujan a resolución completa los rasgos que sí tienen borde duro —cráteres
   con reborde y eyecta, colas de viento, el sistema de cañones, los escudos volcánicos y los
   casquetes con sus surcos en espiral. Devuelve albedo, relieve y rugosidad.               */
function texturaMarte(){
  const BW = 1024, BH = 512;                 // manto base
  const W = 2048, H = 1024;                  // salida
  const LAT = 11;

  /* ── pasada 1: manto ───────────────────────────────────────────── */
  const cb = document.createElement("canvas"); cb.width = BW; cb.height = BH;
  const gb = cb.getContext("2d"); const im = gb.createImageData(BW, BH);
  const cbr = document.createElement("canvas"); cbr.width = BW; cbr.height = BH;
  const gbr = cbr.getContext("2d"); const imr = gbr.createImageData(BW, BH);

  for (let y = 0; y < BH; y++){
    const lat = 90 - (y + 0.5) / BH * 180;
    for (let x = 0; x < BW; x++){
      const u = x / BW * LAT, v = y / BH * (LAT * 0.5);
      const h = fbm(u, v, LAT, 6);                       // relieve continental
      const g2 = fbm(u * 7, v * 7, LAT * 7, 3);          // manchas de albedo
      const g3 = fbm(u * 19, v * 19, LAT * 19, 2);       // grano de polvo
      let alb = 0.5 + (h - 0.5) * 1.22 + (g2 - 0.5) * 0.50 + (g3 - 0.5) * 0.16;
      alb = sat(alb);
      /* rampa medida sobre imágenes reales: del basalto gris-pardo al polvo butterscotch */
      let r, g, b;
      if (alb < 0.42){ const t = alb / 0.42;
        r = mezcla(88, 130, t); g = mezcla(70, 96, t); b = mezcla(62, 74, t);
      } else if (alb < 0.72){ const t = (alb - 0.42) / 0.30;
        r = mezcla(130, 176, t); g = mezcla(96, 132, t); b = mezcla(74, 100, t);
      } else { const t = (alb - 0.72) / 0.28;
        r = mezcla(176, 202, t); g = mezcla(132, 160, t); b = mezcla(100, 122, t);
      }
      const i = (y * BW + x) * 4;
      im.data[i] = r; im.data[i+1] = g; im.data[i+2] = b; im.data[i+3] = 255;
      const e = sat(h * 0.86 + (g3 - 0.5) * 0.22) * 255;
      imr.data[i] = imr.data[i+1] = imr.data[i+2] = e; imr.data[i+3] = 255;
    }
  }
  gb.putImageData(im, 0, 0); gbr.putImageData(imr, 0, 0);

  /* ── pasada 2: rasgos de borde duro ────────────────────────────── */
  const cA = document.createElement("canvas"); cA.width = W; cA.height = H;
  const cR = document.createElement("canvas"); cR.width = W; cR.height = H;
  const cG = document.createElement("canvas"); cG.width = W; cG.height = H;   // rugosidad
  const A = cA.getContext("2d"), R = cR.getContext("2d"), G = cG.getContext("2d");
  A.imageSmoothingEnabled = R.imageSmoothingEnabled = true;
  A.drawImage(cb, 0, 0, W, H);
  R.drawImage(cbr, 0, 0, W, H);
  G.fillStyle = "#D6D6D6"; G.fillRect(0, 0, W, H);       // regolito: muy rugoso por defecto

  const PX = (lon, lat) => [((lon % 360) + 360) % 360 / 360 * W, (90 - lat) / 180 * H];
  const GR = W / 360;                                     // píxeles por grado
  /* dibuja en los tres lienzos con envoltura en el meridiano 0 */
  function enSitio(lon, lat, rGrados, pinta){
    const [x, y] = PX(lon, lat);
    const rx = rGrados * GR / Math.max(0.52, Math.cos(lat * RAD));   // compensa la deformación, con tope
    const ry = rGrados * GR;
    for (const dx of [-W, 0, W]){
      for (const [ctx, cual] of [[A, "a"], [R, "r"], [G, "g"]]){
        ctx.save(); ctx.translate(x + dx, y); pinta(ctx, rx, ry, cual); ctx.restore();
      }
    }
  }

  /* — cráteres con reborde, suelo hundido y manto de eyecta — */
  function crater(lon, lat, d){
    enSitio(lon, lat, d, (c, rx, ry, cual) => {
      c.scale(rx / ry, 1);
      if (cual === "g") return;
      const eye = c.createRadialGradient(0, 0, ry * 0.85, 0, 0, ry * 1.9);
      eye.addColorStop(0, cual === "a" ? "rgba(226,196,158,.13)" : "rgba(150,150,150,.16)");
      eye.addColorStop(1, "rgba(0,0,0,0)");
      c.fillStyle = eye; c.beginPath(); c.arc(0, 0, ry * 1.9, 0, TAU); c.fill();
      const bor = c.createRadialGradient(0, 0, ry * 0.72, 0, 0, ry);
      bor.addColorStop(0, "rgba(0,0,0,0)");
      bor.addColorStop(0.72, cual === "a" ? "rgba(236,208,170,.40)" : "rgba(215,215,215,.55)");
      bor.addColorStop(1, "rgba(0,0,0,0)");
      c.fillStyle = bor; c.beginPath(); c.arc(0, 0, ry, 0, TAU); c.fill();
      const sue = c.createRadialGradient(0, -ry * 0.2, 0, 0, 0, ry * 0.78);
      sue.addColorStop(0, cual === "a" ? "rgba(52,34,26,.50)" : "rgba(46,46,46,.62)");
      sue.addColorStop(1, "rgba(0,0,0,0)");
      c.fillStyle = sue; c.beginPath(); c.arc(0, 0, ry * 0.78, 0, TAU); c.fill();
    });
  }
  /* — cola de viento tras el cráter: la firma más marciana que hay — */
  function cola(lon, lat, largo, ancho, ang, claro){
    enSitio(lon, lat, 1, (c, rx, ry, cual) => {
      if (cual === "g") return;
      c.rotate(ang);
      const g2 = c.createLinearGradient(0, 0, largo * GR, 0);
      const col = claro ? "232,206,170" : "72,48,36";
      g2.addColorStop(0, "rgba(" + col + ",.34)");
      g2.addColorStop(1, "rgba(" + col + ",0)");
      c.fillStyle = cual === "a" ? g2 : "rgba(0,0,0,0)";
      c.beginPath(); c.ellipse(largo * GR * 0.5, 0, largo * GR * 0.5, ancho * GR, 0, 0, TAU); c.fill();
    });
  }
  /* — mancha de albedo suave (Syrtis Major, Acidalia…) — */
  function mancha(lon, lat, d, tono, alfa, aplanar){
    enSitio(lon, lat, d, (c, rx, ry, cual) => {
      if (cual === "g") return;
      c.scale(rx / ry, aplanar || 1);
      const g2 = c.createRadialGradient(0, 0, 0, 0, 0, ry);
      g2.addColorStop(0, "rgba(" + tono + "," + alfa + ")");
      g2.addColorStop(0.6, "rgba(" + tono + "," + (alfa * 0.55) + ")");
      g2.addColorStop(1, "rgba(" + tono + ",0)");
      c.fillStyle = cual === "a" ? g2 : "rgba(0,0,0,0)";
      c.beginPath(); c.arc(0, 0, ry, 0, TAU); c.fill();
    });
  }
  /* — escudo volcánico con caldera — */
  function volcan(lon, lat, d){
    enSitio(lon, lat, d, (c, rx, ry, cual) => {
      if (cual === "g") return;
      c.scale(rx / ry, 1);
      const esc = c.createRadialGradient(0, 0, 0, 0, 0, ry);
      esc.addColorStop(0, cual === "a" ? "rgba(228,196,156,.55)" : "rgba(250,250,250,.85)");
      esc.addColorStop(0.75, cual === "a" ? "rgba(196,150,110,.30)" : "rgba(180,180,180,.4)");
      esc.addColorStop(1, "rgba(0,0,0,0)");
      c.fillStyle = esc; c.beginPath(); c.arc(0, 0, ry, 0, TAU); c.fill();
      c.fillStyle = cual === "a" ? "rgba(58,38,28,.62)" : "rgba(40,40,40,.75)";
      c.beginPath(); c.arc(0, 0, ry * 0.22, 0, TAU); c.fill();      // caldera
    });
  }
  /* — cañón: cadena de segmentos hundidos y oscuros — */
  function canon(lon, lat, largo, ancho, ang){
    const n = 26;
    for (let i = 0; i < n; i++){
      const t = i / (n - 1) - 0.5;
      const dl = Math.cos(ang) * t * largo, dt = Math.sin(ang) * t * largo;
      const w = ancho * (0.45 + 0.55 * Math.cos(t * Math.PI * 0.9));
      enSitio(lon + dl / Math.max(0.3, Math.cos((lat + dt) * RAD)), lat + dt, w,
        (c, rx, ry, cual) => {
          if (cual === "g") return;
          const g2 = c.createRadialGradient(0, 0, 0, 0, 0, ry);
          g2.addColorStop(0, cual === "a" ? "rgba(40,26,22,.80)" : "rgba(20,20,20,.85)");
          g2.addColorStop(1, "rgba(0,0,0,0)");
          c.fillStyle = g2; c.beginPath(); c.arc(0, 0, ry, 0, TAU); c.fill();
        });
    }
  }

  /* campo de cráteres: más densos en el hemisferio sur, como en la realidad */
  let semilla = 7;
  const rnd = () => { semilla = (semilla * 1103515245 + 12345) % 2147483648; return semilla / 2147483648; };
  for (let i = 0; i < 240; i++){
    const lon = rnd() * 360;
    const lat = (rnd() * 2 - 1) * 60;
    if (lat > 0 && rnd() < 0.62) continue;            // dicotomía norte–sur
    const d = 0.6 + Math.pow(rnd(), 3.2) * 7;
    crater(lon, lat, d);
    if (d > 2.2 && rnd() < 0.45)
      cola(lon, lat, d * (2 + rnd() * 4), d * 0.55, (rnd() < 0.5 ? 0.1 : Math.PI - 0.1), rnd() < 0.4);
  }

  /* Las provincias de albedo son mantos de polvo y arena depositados ENCIMA del terreno
     craterizado: por eso se pintan después, o los cráteres las lavarían. */
  mancha(288,  6, 32, "214,176,132", 0.42, 0.80);    // Tharsis, meseta clara
  mancha(342,  8, 22, "58,58,66", 0.88, 1.30);       // Syrtis Major — basalto expuesto, gris azulado
  mancha(336, 18, 13, "64,64,72", 0.62, 1.00);       //   su prolongación norte
  mancha(190, 42, 27, "72,72,82", 0.68, 0.85);       // Acidalia Planitia
  mancha( 20,-14, 21, "84,72,66", 0.58, 1.00);       // Terra Sabaea
  mancha(150,-24, 24, "78,64,58", 0.55, 1.00);       // Terra Cimmeria
  mancha(215,-38, 20, "78,74,78", 0.54, 1.00);       // Terra Sirenum
  mancha( 70,-42, 36, "236,208,172", 0.60, 0.88);    // Hellas Planitia — cuenca clara
  mancha(317,-50, 21, "232,204,166", 0.50, 0.90);    // Argyre
  mancha(250, 22, 28, "230,202,164", 0.42, 0.90);    // Amazonis, manto de polvo
  mancha(110, 30, 26, "222,192,152", 0.34, 0.95);    // Elysium / Utopia claro

  volcan(226, 18, 5.2);                              // Olympus Mons
  volcan(247,  1, 3.4); volcan(248, 11, 3.0); volcan(249, -8, 3.2);   // Tharsis Montes
  volcan(267, 32, 3.0);                              // Alba

  canon(300, -11, 68, 5.4, 0.10);                    // Valles Marineris
  canon(272,  -8, 16, 2.6, 0.9);                     // Noctis Labyrinthus
  canon(325, -20, 20, 2.4, -0.5);                    // Eos / Capri Chasma

  /* Las huellas de remolinos de polvo NO se dibujan: miden 1–10 km, o sea menos de un
     píxel a esta escala. Pintarlas visibles serían rayones, no realismo. */

  /* casquetes polares con surcos en espiral y depósitos estratificados */
  for (const polo of [1, -1]){
    const latB = polo > 0 ? 81 : -79;
    const [, yB] = PX(0, latB);
    const alto = Math.abs(yB - (polo > 0 ? 0 : H));
    for (const [ctx, cual] of [[A, "a"], [R, "r"], [G, "g"]]){
      ctx.save();
      const g2 = ctx.createLinearGradient(0, polo > 0 ? 0 : H, 0, yB);
      const c1 = cual === "a" ? "rgba(231,236,241,1)" : cual === "r" ? "rgba(226,226,226,1)" : "rgba(52,52,52,1)";
      const c0 = cual === "a" ? "rgba(231,236,241,0)" : cual === "r" ? "rgba(226,226,226,0)" : "rgba(52,52,52,0)";
      g2.addColorStop(0, c1); g2.addColorStop(0.62, c1); g2.addColorStop(1, c0);
      ctx.fillStyle = g2;
      ctx.beginPath();                                  // borde lobulado, como el real
      ctx.moveTo(0, polo > 0 ? 0 : H);
      for (let x = 0; x <= W; x += 8){
        const f = x / W * TAU;
        const lob = 1 + Math.sin(f * 3 + 0.7) * 0.11 + Math.sin(f * 7 + 2.1) * 0.055;
        ctx.lineTo(x, (polo > 0 ? 0 : H) + (polo > 0 ? 1 : -1) * alto * lob);
      }
      ctx.lineTo(W, polo > 0 ? 0 : H);
      ctx.closePath(); ctx.fill();
      if (cual !== "g"){
        /* Un surco espiral r = a + b·θ se dibuja aquí como una recta inclinada en x:
           la latitud baja de forma continua con la longitud y el trazo envuelve el mapa. */
        ctx.strokeStyle = cual === "a" ? "rgba(150,132,116,.24)" : "rgba(120,120,120,.30)";
        ctx.lineWidth = Math.max(2, H * 0.003);
        for (let k = 0; k < 4; k++){
          for (const vuelta of [-1, 0, 1]){
            ctx.beginPath();
            for (let x = 0; x <= W; x += 10){
              const f = x / W;
              const rr = alto * (0.46 + k * 0.16 + f * 0.16 + vuelta * 0.64);
              if (rr < alto * 0.42 || rr > alto * 1.00) { ctx.stroke(); ctx.beginPath(); continue; }
              ctx.lineTo(x, (polo > 0 ? 0 : H) + (polo > 0 ? 1 : -1) * rr);
            }
            ctx.stroke();
          }
        }
      }
      ctx.restore();
    }
  }

  const tA = new T.CanvasTexture(cA), tR = new T.CanvasTexture(cR), tG = new T.CanvasTexture(cG);
  tA.colorSpace = T.SRGBColorSpace;
  tA.anisotropy = tR.anisotropy = tG.anisotropy = 8;
  return { albedo: tA, relieve: tR, rugosidad: tG };
}

/* Regolito de superficie: granulado con guijarros, en mosaico repetible */
function texturaRegolito(S){
  const c = document.createElement("canvas"); c.width = c.height = S;
  const g = c.getContext("2d"), im = g.createImageData(S, S), F = 8;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++){
    const n = fbm(x / S * F, y / S * F, F, 5);
    const f = fbm(x / S * F * 11, y / S * F * 11, F * 11, 2);
    const k = sat(n * 0.72 + f * 0.42);
    const i = (y * S + x) * 4;
    im.data[i]   = mezcla(92, 186, k);
    im.data[i+1] = mezcla(48, 112, k);
    im.data[i+2] = mezcla(33, 78, k);
    im.data[i+3] = 255;
  }
  g.putImageData(im, 0, 0);
  const t = new T.CanvasTexture(c);
  t.colorSpace = T.SRGBColorSpace;
  t.wrapS = t.wrapT = T.RepeatWrapping;
  t.anisotropy = 8;
  return t;
}

/* Plumaje moteado de la codorniz japonesa */
function texturaCodorniz(){
  const S = 128, c = document.createElement("canvas"); c.width = c.height = S;
  const g = c.getContext("2d");
  g.fillStyle = "#A8916F"; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 260; i++){
    const x = Math.random() * S, y = Math.random() * S, r = 1.4 + Math.random() * 3.4;
    g.fillStyle = Math.random() < 0.62 ? "rgba(74,55,36,.72)" : "rgba(236,226,206,.55)";
    g.beginPath(); g.ellipse(x, y, r, r * 0.6, Math.random() * TAU, 0, TAU); g.fill();
  }
  const t = new T.CanvasTexture(c);
  t.colorSpace = T.SRGBColorSpace; t.wrapS = t.wrapT = T.RepeatWrapping;
  return t;
}

/* Lienzo de rótulo: la información va pintada sobre el equipo, no flotando en el aire */
function lienzoTex(w, h, dibuja, repetir){
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  dibuja(c.getContext("2d"), w, h);
  const t = new T.CanvasTexture(c);
  t.colorSpace = T.SRGBColorSpace;
  t.anisotropy = 8;
  if (repetir){ t.wrapS = t.wrapT = T.RepeatWrapping; }
  return t;
}
const MONO_TEX = "600 %dpx 'IBM Plex Mono', ui-monospace, monospace";
const SANS_TEX = "700 %dpx Archivo, Helvetica, sans-serif";

/* Chapa rotulada: fondo, filete y una o varias líneas de texto */
function texturaPlaca(lineas, opt){
  opt = opt || {};
  const W = opt.w || 512, H = opt.h || 128;
  return lienzoTex(W, H, (g) => {
    g.fillStyle = opt.fondo || "#12181E"; g.fillRect(0, 0, W, H);
    if (opt.filete !== false){
      g.strokeStyle = opt.borde || "#5A6A76"; g.lineWidth = Math.max(2, H * 0.028);
      g.strokeRect(g.lineWidth, g.lineWidth, W - g.lineWidth * 2, H - g.lineWidth * 2);
    }
    if (opt.barra){ g.fillStyle = opt.barra; g.fillRect(0, 0, W, H * 0.10); }
    let y = H * (opt.y0 !== undefined ? opt.y0 : 0.5);
    for (const L of lineas){
      const px = Math.round(H * (L.s || 0.30));
      g.font = (L.mono === false ? SANS_TEX : MONO_TEX).replace("%d", px);
      g.fillStyle = L.c || "#E8EEF3";
      g.textAlign = "center"; g.textBaseline = "middle";
      if (L.esp){ /* letterspacing manual */
        const txt = L.t, esp = px * L.esp;
        let total = 0;
        for (const ch of txt) total += g.measureText(ch).width + esp;
        total -= esp;
        let x = W / 2 - total / 2;
        for (const ch of txt){ g.textAlign = "left"; g.fillText(ch, x, y); x += g.measureText(ch).width + esp; }
        g.textAlign = "center";
      } else {
        g.fillText(L.t, W / 2, y);
      }
      y += px * (L.sig || 1.45);
    }
  });
}

/* Casco: chapas remachadas con polvo acumulado abajo */
function texturaCasco(){
  return lienzoTex(1024, 512, (g, W, H) => {
    g.fillStyle = "#E9ECEF"; g.fillRect(0, 0, W, H);
    for (let y = 0; y < H; y += H / 4){                  // juntas horizontales
      g.fillStyle = "rgba(120,134,146,.34)"; g.fillRect(0, y, W, 3);
      g.fillStyle = "rgba(255,255,255,.55)"; g.fillRect(0, y + 3, W, 2);
    }
    for (let x = 0; x < W; x += W / 12){                 // juntas verticales
      g.fillStyle = "rgba(120,134,146,.22)"; g.fillRect(x, 0, 2, H);
    }
    for (let y = H / 8; y < H; y += H / 4)               // remaches
      for (let x = W / 24; x < W; x += W / 12){
        g.fillStyle = "rgba(105,118,130,.5)";
        g.beginPath(); g.arc(x, y, 2.6, 0, TAU); g.fill();
      }
    const grad = g.createLinearGradient(0, H * 0.55, 0, H);   // polvo marciano en la falda
    grad.addColorStop(0, "rgba(150,86,48,0)");
    grad.addColorStop(1, "rgba(150,86,48,.45)");
    g.fillStyle = grad; g.fillRect(0, H * 0.55, W, H * 0.45);
    for (let i = 0; i < 260; i++){                        // salpicado
      const x = Math.random() * W, y = H * (0.5 + Math.random() * 0.5);
      g.fillStyle = "rgba(146,84,46," + (0.05 + Math.random() * 0.16).toFixed(2) + ")";
      g.beginPath(); g.arc(x, y, 1 + Math.random() * 7, 0, TAU); g.fill();
    }
  }, true);
}

/* Cubierta: chapa antiderrapante */
function texturaCubierta(){
  return lienzoTex(256, 256, (g, W, H) => {
    g.fillStyle = "#414A54"; g.fillRect(0, 0, W, H);
    g.strokeStyle = "rgba(24,29,34,.55)"; g.lineWidth = 2;
    for (let i = 0; i < 8; i++){                          // lágrimas en damero
      for (let j = 0; j < 8; j++){
        const x = i * 32 + (j % 2) * 16, y = j * 32;
        g.save(); g.translate(x + 16, y + 16); g.rotate((i + j) % 2 ? 0.7 : -0.7);
        g.fillStyle = "rgba(146,159,172,.42)"; g.fillRect(-9, -2.6, 18, 5.2);
        g.strokeRect(-9, -2.6, 18, 5.2); g.restore();
      }
    }
  }, true);
}

/* Costra de musgo: la superficie sellada de la bandeja, no una alfombra lisa */
function texturaMusgo(){
  return lienzoTex(256, 256, (g, W, H) => {
    g.fillStyle = "#3A5C2A"; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 900; i++){
      const x = Math.random() * W, y = Math.random() * H, r = 1 + Math.random() * 5;
      const v = Math.random();
      g.fillStyle = v < 0.5 ? "rgba(96,150,62,.55)" : v < 0.85 ? "rgba(52,88,38,.6)"
                                                    : "rgba(140,178,96,.5)";
      g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    }
    for (let i = 0; i < 40; i++){                         // grietas de desecación
      g.strokeStyle = "rgba(30,48,22,.5)"; g.lineWidth = 1 + Math.random();
      g.beginPath(); g.moveTo(Math.random() * W, Math.random() * H);
      for (let j = 0; j < 4; j++) g.lineTo(Math.random() * W, Math.random() * H);
      g.stroke();
    }
  }, true);
}

/* Hoja: limbo con degradado de base a ápice, nervadura de tres órdenes y borde más oscuro.
   Devuelve también un mapa de relieve para que los nervios se noten con la luz.        */
function texturaHoja(op){
  const W = 256, H = 512;
  const pinta = (g, relieve) => {
    if (relieve){ g.fillStyle = "#8A8A8A"; g.fillRect(0, 0, W, H); }
    else {
      const base = g.createLinearGradient(0, H, 0, 0);    // más oscura en la base
      base.addColorStop(0, "#8C8C8C"); base.addColorStop(0.55, "#B4B4B4"); base.addColorStop(1, "#D2D2D2");
      g.fillStyle = base; g.fillRect(0, 0, W, H);
      for (let i = 0; i < 240; i++){                      // moteado del limbo
        const a = Math.random() < 0.5 ? "rgba(255,255,255,.10)" : "rgba(0,0,0,.07)";
        g.fillStyle = a;
        g.beginPath(); g.ellipse(Math.random() * W, Math.random() * H,
          3 + Math.random() * 14, 2 + Math.random() * 9, Math.random() * TAU, 0, TAU); g.fill();
      }
      const borde = g.createRadialGradient(W / 2, H / 2, W * 0.28, W / 2, H / 2, W * 0.62);
      borde.addColorStop(0, "rgba(0,0,0,0)"); borde.addColorStop(1, "rgba(0,0,0,.30)");
      g.fillStyle = borde; g.fillRect(0, 0, W, H);
    }
    const cN = relieve ? "#EDEDED" : "rgba(255,255,255,.62)";
    const cN2 = relieve ? "#DCDCDC" : "rgba(255,255,255,.40)";
    g.lineCap = "round";
    g.strokeStyle = cN; g.lineWidth = relieve ? 7 : 5;    // nervio central
    g.beginPath(); g.moveTo(W / 2, H); g.quadraticCurveTo(W / 2 + 4, H * 0.5, W / 2, H * 0.03); g.stroke();
    for (let i = 1; i <= 11; i++){                        // secundarios, curvados hacia el ápice
      const y = H - i * H / 11.6, d = (H - y) * 0.46 + 6;
      g.lineWidth = relieve ? 4 : 2.6; g.strokeStyle = cN2;
      for (const sgn of [-1, 1]){
        g.beginPath(); g.moveTo(W / 2, y);
        g.quadraticCurveTo(W / 2 + sgn * d * 0.7, y - H * 0.02, W / 2 + sgn * d, y - H * 0.075);
        g.stroke();
        g.lineWidth = relieve ? 2 : 1.2;                  // terciarios
        for (let k = 1; k <= 2; k++){
          const t = k / 3;
          const bx = W / 2 + sgn * d * t, by = y - H * 0.075 * t * t;
          g.beginPath(); g.moveTo(bx, by);
          g.lineTo(bx + sgn * d * 0.16, by - H * 0.028); g.stroke();
        }
        g.lineWidth = relieve ? 4 : 2.6;
      }
    }
  };
  const mapa = lienzoTex(W, H, (g) => pinta(g, false));
  const rel = lienzoTex(W, H, (g) => pinta(g, true));
  return { mapa, rel };
}

/* Huevo de codorniz: crema con las manchas pardas irregulares que la especie tiene de verdad */
function texturaHuevo(){
  return lienzoTex(256, 128, (g, W, H) => {
    const base = g.createLinearGradient(0, 0, 0, H);
    base.addColorStop(0, "#F0E6CC"); base.addColorStop(0.5, "#E4D6B4"); base.addColorStop(1, "#D8C8A4");
    g.fillStyle = base; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 130; i++){                        // manchas grandes
      const x = Math.random() * W, y = Math.random() * H;
      const r = 3 + Math.pow(Math.random(), 1.8) * 15;
      g.fillStyle = Math.random() < 0.62 ? "rgba(66,44,26,.72)" : "rgba(112,78,44,.55)";
      g.beginPath();
      g.moveTo(x + r, y);
      for (let a = 0; a < 9; a++){                        // contorno irregular
        const ang = a / 9 * TAU, rr = r * (0.55 + Math.random() * 0.65);
        g.lineTo(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr * 0.8);
      }
      g.closePath(); g.fill();
    }
    for (let i = 0; i < 400; i++){                        // salpicado fino
      g.fillStyle = "rgba(74,50,28,.38)";
      g.beginPath(); g.arc(Math.random() * W, Math.random() * H, 0.7 + Math.random() * 2, 0, TAU); g.fill();
    }
  });
}

/* Flujo dentro de la tubería: banda que se desplaza, no bolas en el aire */
function texturaFlujo(hex){
  const c = new T.Color(hex);
  const base = c.clone().multiplyScalar(0.46).getStyle();
  const vivo = c.clone().lerp(new T.Color(0xffffff), 0.30).getStyle();
  const t = lienzoTex(128, 8, (g, W, H) => {
    g.fillStyle = base; g.fillRect(0, 0, W, H);
    g.fillStyle = "rgba(255,255,255,.10)"; g.fillRect(0, 0, W, 2);   // brillo del tubo
    for (let i = 0; i < 2; i++){                          // dos testigos que corren dentro
      const gr = g.createLinearGradient(i * 64, 0, i * 64 + 26, 0);
      gr.addColorStop(0, base); gr.addColorStop(0.5, vivo); gr.addColorStop(1, base);
      g.fillStyle = gr; g.fillRect(i * 64, 2, 26, H - 2);
    }
  }, true);
  return t;
}

/* Celdas del panel solar */
function texturaSolar(){
  return lienzoTex(256, 256, (g, W, H) => {
    g.fillStyle = "#16233C"; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++){
      const x = i * 42 + 4, y = j * 42 + 4;
      const gr = g.createLinearGradient(x, y, x + 38, y + 38);
      gr.addColorStop(0, "#22375C"); gr.addColorStop(1, "#152034");
      g.fillStyle = gr; g.fillRect(x, y, 38, 38);
      g.strokeStyle = "rgba(180,200,225,.30)"; g.lineWidth = 1;
      for (let k = 1; k < 4; k++){ g.beginPath(); g.moveTo(x + k * 9.5, y); g.lineTo(x + k * 9.5, y + 38); g.stroke(); }
    }
  }, true);
}

/* ═══════════════════════════════════════════════════════════════
   MATERIAL DE CIELO — degradado marciano y espacio, con un solo shader
   ═══════════════════════════════════════════════════════════════ */
const cieloUnif = {
  cenit:   { value: new T.Color(0x2A2A3C) },
  horiz:   { value: new T.Color(0xC79468) },
  suelo:   { value: new T.Color(0x3A1E14) },
  mezclaEspacio: { value: 0 },
};
const cielo = new T.Mesh(
  new T.SphereGeometry(900, 32, 24),
  new T.ShaderMaterial({
    side: T.BackSide, depthWrite: false, uniforms: cieloUnif,
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      uniform vec3 cenit, horiz, suelo; uniform float mezclaEspacio; varying vec3 vP;
      void main(){
        float h = normalize(vP).y;
        vec3 c = h > 0.0 ? mix(horiz, cenit, pow(h, 0.62)) : mix(horiz, suelo, pow(-h, 0.75));
        c = mix(c, vec3(0.012, 0.016, 0.026), mezclaEspacio);
        gl_FragColor = vec4(c, 1.0);
      }`
  })
);
escena.add(cielo);

/* estrellas: solo se ven en la vista de planeta */
const estGeo = new T.BufferGeometry();
const NE = 2600, pos = new Float32Array(NE * 3), tam = new Float32Array(NE);
for (let i = 0; i < NE; i++){
  const v = new T.Vector3().randomDirection().multiplyScalar(600 + Math.random() * 200);
  pos[i*3] = v.x; pos[i*3+1] = v.y; pos[i*3+2] = v.z;
  tam[i] = Math.random() < 0.06 ? 2.6 : 0.9 + Math.random();
}
estGeo.setAttribute("position", new T.BufferAttribute(pos, 3));
estGeo.setAttribute("size", new T.BufferAttribute(tam, 1));
const estrellas = new T.Points(estGeo, new T.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { op: { value: 0 } },
  vertexShader: `attribute float size; varying float vS; void main(){ vS = size;
    vec4 mv = modelViewMatrix * vec4(position,1.0);
    gl_PointSize = size * 1.7; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `uniform float op; varying float vS;
    void main(){ float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.06, d); gl_FragColor = vec4(vec3(1.0, 0.97, 0.93), a * op); }`
}));
escena.add(estrellas);

/* ═══ diagramas de ficha ═══ pequeños, con datos reales, sin librerías */
const VIZ = {
  /* barra de proporción: tramos [ancho%, color, etiqueta] */
  barra(titulo, tramos, izq, der){
    return `<div><div class="viz-cap">${titulo}</div><div class="viz-barra">` +
      tramos.map(([w, c]) => `<i style="width:${w}%;background:${c}"></i>`).join("") +
      `</div><div class="viz-pie"><span>${izq}</span><span>${der}</span></div></div>`;
  },
  /* cadena de pasos con flechas */
  cadena(titulo, pasos){
    return `<div><div class="viz-cap">${titulo}</div><div class="viz-cadena">` +
      pasos.map(([t, c], i) =>
        (i ? `<span class="viz-flecha">&#8594;</span>` : "") +
        `<span class="viz-pill" style="color:${c};border-color:${c}44">${t}</span>`).join("") +
      `</div></div>`;
  },
  /* rejilla de n celdas, con las marcadas en otro color */
  rejilla(titulo, n, cols, marcadas, colOK, colMal, pie){
    let cel = "";
    for (let i = 0; i < n; i++)
      cel += `<div class="viz-cel" style="background:${marcadas.includes(i) ? colMal : colOK}"></div>`;
    return `<div><div class="viz-cap">${titulo}</div>` +
      `<div class="viz-rej" style="grid-template-columns:repeat(${cols},1fr)">${cel}</div>` +
      (pie ? `<div class="viz-pie"><span>${pie}</span></div>` : "") + `</div>`;
  },
  nota(t){ return `<div class="viz-nota">${t}</div>`; },
};

const R_MARTE = 5;
let marte, nubePolvo;
const marcas = [];      // puntos clicables sobre el globo

function construirPlaneta(tex){
  marte = new T.Mesh(
    new T.SphereGeometry(R_MARTE, 96, 64),
    new T.MeshStandardMaterial({
      map: tex.albedo, bumpMap: tex.relieve, bumpScale: 0.075,
      roughnessMap: tex.rugosidad, roughness: 1.0, metalness: 0.0,
    })
  );
  marte.rotation.y = Math.PI;       // 0° de longitud hacia la cámara inicial
  marte.castShadow = marte.receiveShadow = true;
  gPlaneta.add(marte);

  /* atmósfera: borde fresnel, muy fina, como la real */
  const atm = new T.Mesh(
    new T.SphereGeometry(R_MARTE * 1.028, 64, 48),
    new T.ShaderMaterial({
      side: T.BackSide, transparent: true, depthWrite: false, blending: T.AdditiveBlending,
      uniforms: { c: { value: new T.Color(0xE0906A) }, c2: { value: new T.Color(0x8FB6D8) } },
      vertexShader: `varying vec3 vN; varying vec3 vP;
        void main(){ vN = normalize(normalMatrix * normal);
          vec4 mv = modelViewMatrix * vec4(position,1.0); vP = mv.xyz;
          gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `uniform vec3 c; uniform vec3 c2; varying vec3 vN; varying vec3 vP;
        void main(){
          float d = 1.0 - abs(dot(normalize(vN), normalize(-vP)));
          float f = pow(d, 3.2);
          float bruma = pow(d, 9.0);                 // el limbo alto se ve azul-blanco
          gl_FragColor = vec4(mix(c, c2, bruma * 0.75), f * 0.75 + bruma * 0.5); }`
    })
  );
  gPlaneta.add(atm);

  /* velo de polvo en suspensión, girando un poco más lento que el planeta */
  nubePolvo = new T.Mesh(
    new T.SphereGeometry(R_MARTE * 1.012, 64, 48),
    new T.MeshBasicMaterial({
      color: 0xD9A87E, transparent: true, opacity: 0.10,
      depthWrite: false, blending: T.AdditiveBlending,
    })
  );
  gPlaneta.add(nubePolvo);

  /* marcas de interés, situadas por longitud/latitud reales */
  const PUNTOS = [
    ["regolito", "Percloratos · Phoenix",  234.3,  68.2],
    ["agua",     "Hielo · casquete norte",  20.0,  84.0],
    ["valles",   "Valles Marineris",       300.0, -14.0],
    ["polvo",    "Tormentas · Hellas",      70.0, -42.0],
    ["sitio",    "Sitio del hábitat",      137.0,  -4.5, true],
  ];
  for (const [clave, texto, lon, lat, esSitio] of PUNTOS){
    const p = new T.Vector3().setFromSphericalCoords(
      R_MARTE * 1.008, (90 - lat) * RAD, (lon - 180) * RAD);
    const anillo = new T.Mesh(
      new T.RingGeometry(0.10, 0.135, 24),
      new T.MeshBasicMaterial({ color: esSitio ? 0x7FBB72 : 0xD2622F,
        transparent: true, opacity: 0.95, side: T.DoubleSide, depthWrite: false })
    );
    anillo.position.copy(p);
    anillo.lookAt(p.clone().multiplyScalar(2));
    marte.add(anillo);
    marcas.push({ clave, texto, p, anillo, esSitio, el: null });
  }
}

   trasvase: un lote no se palea de un anillo a otro, avanza de posición siendo el mismo.    */
const N_POS = GEOM.anillo.n;                   // 20 posiciones: 8 de regeneración + 12 de cultivo
const N_REG = GEOM.ciclo.n_regeneracion;
const N_CUL = GEOM.ciclo.n_cultivo;

const SOLES_MISION = GEOM.mision.soles_horizonte;

const A_PARED = 0.57, A_LARGO = TAU * 0.62;    // pared en MI convención (x=cos a, z=sin a)

const CIL_INI  = Math.PI / 2 - A_FIN;          // CylinderGeometry: x=sin θ, z=cos θ
