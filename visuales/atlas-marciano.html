<section class="section hero"><div class="planet" role="img" aria-label="Mapa Viking de Marte"></div><div class="hero-copy"><div class="eyebrow">BIOMARS CHIAPAS / ATLAS 01</div><h1 data-es="La vida, en otro mundo." data-en="Life, on another world."></h1><p class="lead" data-es="Antes de cultivar en Marte, hay que entender el lugar. Y después, conectar cada proceso." data-en="Before growing on Mars, understand the place. Then connect every process."></p><a class="button" href="#contexto" data-es="Comenzar la exploración ↓" data-en="Start exploring ↓"></a></div><p class="footnote hero-credit" data-es="Imagen Viking · NASA/JPL-Caltech · USGS. Representación esférica ilustrativa; sin datos de elevación." data-en="Viking image · NASA/JPL-Caltech · USGS. Illustrative spherical representation; no elevation data."></p></section>
<section class="section" id="contexto"><span class="section-number">02 / 05</span><div class="eyebrow" data-es="EL ENTORNO / DATOS PUBLICADOS" data-en="THE ENVIRONMENT / PUBLISHED DATA"></div><h2 data-es="Diseñar empieza por los límites." data-en="Design starts with the constraints."></h2><div class="facts"><article class="fact"><div class="value">3.71 <span class="unit">m/s²</span></div><h3 data-es="Menos peso. La misma masa." data-en="Less weight. The same mass."></h3><p data-card="gravedad"></p></article><article class="fact"><div class="value">~6 <span class="unit">mbar</span></div><h3 data-es="Una cabina presurizada." data-en="A pressurized cabin."></h3><p data-card="atmosfera"></p></article><article class="fact"><div class="value">~0.7 <span class="unit">mSv/d</span></div><h3 data-es="Protección por dimensionar." data-en="Shielding to be sized."></h3><p data-card="radiacion"></p></article></div><p class="footnote" data-es="Referencias de contexto, no condiciones universales de un sitio ni certificación de seguridad. La dosis depende del lugar, tiempo y blindaje." data-en="Context references, not universal site conditions or safety certification. Dose depends on location, time and shielding."></p><div class="links"><a href="../INVESTIGACION-MARTE.md" data-es="Fuentes del contexto ↗" data-en="Context sources (ES) ↗"></a><a href="../prototipo-3d/vendor/CREDITOS-MARTE.md" data-es="Créditos del mapa ↗" data-en="Map credits (ES) ↗"></a></div></section>
<section class="section delay" id="demora"><span class="section-number">03 / 05</span><div class="grid"><div><div class="eyebrow" data-es="LA DISTANCIA / EXPLORA EL RETARDO" data-en="THE DISTANCE / EXPLORE THE DELAY"></div><h2 data-es="La siguiente decisión es local." data-en="The next decision is local."></h2><p class="lead" data-card="comms"></p><p class="footnote" data-es="Escenario de comunicación. La escala del dibujo no es orbital; no representa posiciones actuales de los planetas." data-en="Communication scenario. The diagram is not to orbital scale and does not represent current planetary positions."></p></div><div><div class="signal"><span class="endpoint"></span><div class="track"></div><span class="endpoint mars"></span></div><div class="signal-labels"><span data-es="TIERRA" data-en="EARTH"></span><span data-es="MARTE" data-en="MARS"></span></div><div class="delay-number"><output id="ida">12</output> <small data-es="min de ida" data-en="min one way"></small></div><label for="retardo" class="range-label" data-es="Cambia la demora de la señal" data-en="Change the signal delay"></label><input id="retardo" class="range" type="range" min="3" max="22" value="12" step="1"><div class="roundtrip"><p data-es="Ida + vuelta, sin contar el tiempo para decidir" data-en="Round trip, excluding decision time"></p><output id="vuelta">24 min</output></div></div></div></section>
<section class="section" id="ciclo"><span class="section-number">04 / 05</span><div class="grid"><div><div class="eyebrow" data-es="EL SISTEMA / GEOMETRÍA NOMINAL" data-en="THE SYSTEM / NOMINAL GEOMETRY"></div><h2 data-es="Un cartucho. Un historial completo." data-en="One cartridge. A complete history."></h2><p class="lead" data-es="Veinte sectores iguales. Ocho estaciones de regeneración y doce posiciones de cultivo. Explora cómo se conecta cada parte." data-en="Twenty identical sectors. Eight recovery stations and twelve crop positions. Explore how each part connects."></p><div class="steps" role="group" aria-label="Proceso"><button data-process="lavado" data-es="01 · Regenerar" data-en="01 · Recover"></button><button data-process="digestor" data-es="02 · Recuperar" data-en="02 · Recycle"></button><button data-process="cultivo" data-es="03 · Cultivar" data-en="03 · Grow"></button></div><div id="detail" class="detail" aria-live="polite"></div></div><div><svg class="ring" viewBox="0 0 500 500" role="img" aria-label="20 cartuchos en un anillo"><circle cx="250" cy="250" r="225" fill="none" stroke="#3c5663"/><circle cx="250" cy="250" r="140" fill="none" stroke="#345360" stroke-dasharray="3 8"/><g id="sectors"></g><text x="250" y="233" class="ring-label">MILPA·360</text><text x="250" y="263" class="ring-code" id="ring-area"></text><text x="250" y="286" class="ring-code" id="ring-width"></text></svg><p class="footnote" data-es="Esquema de posiciones generado desde la configuración. No muestra acceso, tolerancias de fabricación ni todas las instalaciones." data-en="Position diagram generated from the configuration. It does not show access, manufacturing tolerances or all installations."></p></div></div></section>
<section class="section return" id="retorno"><span class="section-number">05 / 05</span><div class="grid"><div><div class="eyebrow" data-es="EL ALCANCE / CÁLCULO, NO COSECHA MEDIDA" data-en="THE SCOPE / CALCULATION, NOT MEASURED HARVEST"></div><h2 data-es="Aportar alimento fresco. Medir el resultado." data-en="Provide fresh food. Measure the result."></h2><p class="lead" data-card="retorno"></p><a class="button" data-preserve-language href="../prototipo-3d/milpa360-simulador.html?vista=habitat&play=0" data-es="Explorar el módulo en 3D ↗" data-en="Explore the module in 3D ↗"></a></div><div><div class="value" id="coverage"></div><h3 data-es="de las kcal de seis personas, escenario nominal" data-en="of the calories for six people, nominal scenario"></h3><div class="contribution"><i></i></div><p data-es="Este módulo complementa la dieta. Las provisiones se dimensionan sin descontar una cosecha todavía no validada." data-en="This module supplements the diet. Provisions are sized without crediting a harvest that has not been validated."></p><div class="split"><div><h3 data-es="Calculado" data-en="Calculated"></h3><p data-es="Área útil, masas y balances bajo supuestos identificados." data-en="Usable area, masses and balances under explicit assumptions."></p></div><div><h3 data-es="Por demostrar" data-en="To be demonstrated"></h3><p data-es="Producción real, sanidad, mantenimiento y funcionamiento en gravedad parcial." data-en="Actual production, sanitary performance, maintenance and partial-gravity operation."></p></div></div><a href="../docs/madrid/CALCULOS-CIERRE.md" data-es="Seguir las cifras hasta el cálculo ↗" data-en="Trace the figures to the calculation (ES) ↗"></a></div></div></section>
</main><footer><span data-es="MILPA-360 / BioMars Chiapas · Revisión visual V2" data-en="MILPA-360 / BioMars Chiapas · Visual revision V2"></span><a href="../docs/madrid/ESTADO.md" data-es="Estado y límites del proyecto ↗" data-en="Project status and limitations (ES) ↗"></a></footer>
<script>
let selected='lavado';
const g=MILPA_DATOS.geometria,b=MILPA_DATOS.balance;
const sector=(i)=>{const a=(i/g.anillo.n*2*Math.PI)-Math.PI/2,delta=2*Math.PI/g.anillo.n*.94;const point=(r,t)=>[250+r*Math.cos(t),250+r*Math.sin(t)].join(',');return `M${point(165,a)}L${point(215,a)}A215,215 0 0 1 ${point(215,a+delta)}L${point(165,a+delta)}A165,165 0 0 0 ${point(165,a)}Z`;};
document.getElementById('sectors').innerHTML=Array.from({length:g.anillo.n},(_,i)=>`<path data-sector="${i}" d="${sector(i)}" fill="${i<8?'#759fac':'#849c64'}"/>`).join('');
function paint(){
 const lang=MILPA_I18N.lang,fs=MILPA_FICHAS(MILPA_DATOS),p=MILPA_I18N.pick;
 document.querySelectorAll('[data-es]').forEach(el=>el.textContent=el.dataset[lang]);
 document.querySelectorAll('[data-card]').forEach(el=>el.textContent=fs[el.dataset.card].txt);
 const f=fs[selected];document.getElementById('detail').innerHTML=`<h3>${f.tit}</h3><p>${f.txt}</p><p class="footnote">${f.d[0][0]} · <span class="value">${f.d[0][1]}</span></p>`;
 document.querySelectorAll('[data-process]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.process===selected)));
 document.querySelectorAll('[data-sector]').forEach(el=>{const i=Number(el.dataset.sector);el.classList.toggle('active',selected==='lavado'?i<8:selected==='cultivo'?i>=8:false);});
 document.getElementById('ring-area').textContent=g.areas.cultivo.toFixed(2)+' m² · '+p('cultivo','crops');document.getElementById('ring-width').textContent='Ø '+g.casco.diametro.toFixed(2)+' m';
 document.getElementById('coverage').textContent=(b.cobertura_kcal*100).toFixed(2)+'%';document.documentElement.style.setProperty('--coverage',b.cobertura_kcal*100+'%');
 document.title=p('Atlas · MILPA-360','Atlas · MILPA-360');MILPA_I18N.apply();
}
function signal(){const v=Number(document.getElementById('retardo').value);document.getElementById('ida').value=v;document.getElementById('vuelta').value=(v*2)+' min';document.documentElement.style.setProperty('--travel',((v-3)/19*70)+'%');}
document.querySelectorAll('[data-process]').forEach(el=>el.onclick=()=>{selected=el.dataset.process;paint();});document.getElementById('retardo').oninput=signal;
addEventListener('milpa-language',paint);addEventListener('DOMContentLoaded',()=>{paint();signal();});
</script></body></html>
