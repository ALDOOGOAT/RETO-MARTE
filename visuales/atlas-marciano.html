rtial-gravity operation."></p></div></div><a href="../docs/madrid/CALCULOS-CIERRE.md" data-es="Seguir las cifras hasta el cálculo ↗" data-en="Trace the figures to the calculation (ES) ↗"></a></div></div></section>

<script>
let selected='lavado';
const g=MILPA_DATOS.geometria,b=MILPA_DATOS.balance;
const sector=(i)=>{const a=(i/g.anillo.n*2*Math.PI)-Math.PI/2,delta=2*Math.PI/g.anillo.n*.94;const point=(r,t)=>[250+r*Math.cos(t),250+r*Math.sin(t)].join(',');return `M${point(165,a)}L${point(215,a)}A215,215 0 0 1 ${point(215,a+delta)}L${point(165,a+delta)}A165,165 0 0 0 ${point(165,a)}Z`;};
document.getElementById('sectors').innerHTML=Array.from({length:g.anillo.n},(_,i)=>`<path data-sector="${i}" d="${sector(i)}" fill="${i<8?'#759fac':'#849c64'}"/>`).join('');
function paint(){
 const lang=MILPA_I18N.lang,fs=MILPA_FICHAS(MILPA_DATOS),p=MILPA_I18N.pick;
 document.querySelectorAll('[data-es]').forEach(el=>el.textContent=el.dataset[lang]);
 document.querySelectorAll('[data-card]').forEach(el=>el.textContent=fs[el.dataset.card].txt);
 const f=fs[selected];document.getElementById('detail').innerHTML=`<h3>${f.tit}</h3><p>${f.txt}</p><p class="footnote">${f.d[0][0]} · <span class="value">${f.d[0][1]}</span></p>`;
 document.querySelectorAll('[data-process]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.process===selected)));
 document.querySelectorAll('[data-sector]').forEach(el=>{const i=Number(el.dataset.sector);el.classList.toggle('active',selected==='lavado'?i<8:selected==='cultivo'?i>=8:false);});
 document.title=p('Atlas · MILPA-360','Atlas · MILPA-360');MILPA_I18N.apply();
}
function signal(){const v=Number(document.getElementById('retardo').value);document.getElementById('ida').value=v;document.getElementById('vuelta').value=(v*2)+' min';document.documentElement.style.setProperty('--travel',((v-3)/19*70)+'%');}
document.querySelectorAll('[data-process]').forEach(el=>el.onclick=()=>{selected=el.dataset.process;paint();});document.getElementById('retardo').oninput=signal;
addEventListener('milpa-language',paint);addEventListener('DOMContentLoaded',()=>{paint();signal();});
</script>
<script>
/* Atlas interactivo: comparar con la Tierra, enviar un aviso, recorrer el anillo y repartir las calorías.
   Las cifras de Marte y del módulo salen de MILPA_DATOS / fichas; las de la Tierra están citadas al pie. */
(function(){
 const $=id=>document.getElementById(id),p=(es,en)=>MILPA_I18N.pick(es,en),t=s=>MILPA_I18N.t(s);
 const D=MILPA_DATOS,g=D.geometria,b=D.balance,reducido=matchMedia('(prefers-reduced-motion: reduce)');
 const num=s=>parseFloat(String(s).replace(/[^\d.]/g,''));

 // 1 · Tierra frente a Marte: una barra gris de referencia y el acento en Marte.
 const TIERRA={gravedad:9.81,atmosfera:1013,radiacion:2.4/365};
 const cifra=v=>v<.1?v.toFixed(4):v>=100?String(Math.round(v)):String(+v.toFixed(2));
 function comparar(){
  const F=MILPA_FICHAS(D);
  document.querySelectorAll('[data-vs]').forEach(el=>{
   const k=el.dataset.vs,texto=F[k].d[0][1],marte=num(texto),unidad=texto.replace(/^[~≈\s\d.]+/,''),tierra=TIERRA[k],max=Math.max(marte,tierra),r=marte/tierra;
   const fila=(clase,nombre,v,etq)=>`<div class="vs-fila ${clase}"><span>${nombre}</span><span class="vs-pista"><i class="vs-barra" style="width:${Math.max(.8,v/max*100)}%"></i></span><span class="vs-valor">${etq}</span></div>`;
   const razon=k==='radiacion'?p(`≈${Math.round(r)} veces la dosis natural media en la Tierra`,`≈${Math.round(r)} times Earth's average natural dose`)
    :k==='atmosfera'?p(`${(r*100).toFixed(1)} % de la presión al nivel del mar`,`${(r*100).toFixed(1)}% of sea-level pressure`)
    :p(`${Math.round(r*100)} % de la gravedad terrestre`,`${Math.round(r*100)}% of Earth's gravity`);
   el.innerHTML=fila('tierra',p('Tierra','Earth'),tierra,cifra(tierra)+' '+unidad)+fila('marte',p('Marte','Mars'),marte,texto)+`<p class="vs-razon">${razon}</p>`;
   el.setAttribute('role','img');el.setAttribute('aria-label',`${p('Tierra','Earth')} ${cifra(tierra)} ${unidad}; ${p('Marte','Mars')} ${texto}. ${razon}`);
  });
 }
 new IntersectionObserver((es,o)=>{for(const e of es)if(e.isIntersecting){e.target.classList.add('visto');o.unobserve(e.target);}},{threshold:.3}).observe($('contexto'));
 document.querySelectorAll('.fact').forEach(f=>f.addEventListener('click',()=>MILPA_ISLA.decir(f.querySelector('[data-vs]').dataset.vs,f.querySelector('h3').textContent)));

 // 2 · Un aviso de Marte viaja a la Tierra y vuelve; el módulo decide antes de que llegue la respuesta.
 const demora=$('demora'),pulso=demora.querySelector('.pulso'),hitos=[...demora.querySelectorAll('.hito')],local=demora.querySelector('.local'),eje=demora.querySelector('.eje');
 let envio=0;
 function tiempos(){
  ++envio;const d=Number($('retardo').value);
  $('t-ida').textContent=d+' min';$('t-vuelta').textContent=2*d+' min';$('reloj-senal').textContent='';
  eje.style.setProperty('--avance',0);hitos.forEach(h=>h.classList.remove('llego'));local.classList.remove('activo');
  demora.classList.remove('enviando');$('enviar').disabled=false;
 }
 function enviar(){
  tiempos();
  const d=Number($('retardo').value),total=2*d,dur=reducido.matches?0:Math.min(9000,Math.max(3500,total*280)),token=envio,t0=performance.now();
  demora.classList.add('enviando');$('enviar').disabled=true;local.classList.add('activo');
  const paso=ahora=>{
   if(token!==envio)return;
   const u=dur?Math.min(1,(ahora-t0)/dur):1;
   pulso.style.left=(u<.5?100-u*200:(u-.5)*200)+'%';   // Marte (derecha) → Tierra → Marte
   eje.style.setProperty('--avance',u);
   hitos.forEach((h,i)=>h.classList.toggle('llego',u>=i/2));
   $('reloj-senal').textContent='t = '+Math.floor(u*total)+' min';
   if(u<1)requestAnimationFrame(paso);else{demora.classList.remove('enviando');$('enviar').disabled=false;}
  };
  requestAnimationFrame(paso);
 }
 $('enviar').onclick=enviar;$('retardo').addEventListener('input',tiempos);

 // 3 · El anillo se lee al pasar; un cartucho recorre sus 20 posiciones con su reloj de soles.
 const E=g.estaciones,n=g.anillo.n,paths=[...document.querySelectorAll('[data-sector]')],cartucho=$('cartucho');
 const delta=2*Math.PI/n*g.anillo.holgura_angular,ang=pos=>pos/n*2*Math.PI-Math.PI/2+delta/2;
 let viaje=0,fijo=null;
 function centro(i){
  const et=$('ring-label');
  if(i==null){et.textContent='MILPA·360';et.classList.remove('codigo');$('ring-area').textContent=g.areas.cultivo.toFixed(2)+' m² · '+p('cultivo','crops');$('ring-width').textContent='Ø '+g.casco.diametro.toFixed(2)+' m';$('lectura').textContent='';return;}
  const e=E[i];et.textContent=e.codigo;et.classList.add('codigo');
  $('ring-area').textContent=t(e.nombre);$('ring-width').textContent=p('llega el sol ','reached at sol ')+i*g.anillo.soles_por_paso;
  $('lectura').innerHTML=`<b>${e.codigo} · ${t(e.nombre)}.</b> ${t(e.detalle)}`;
 }
 paths.forEach((el,i)=>{
  el.setAttribute('tabindex','0');el.setAttribute('aria-label',E[i].codigo+' · '+t(E[i].nombre));
  el.addEventListener('pointerenter',()=>{if(!viaje)centro(i);});
  el.addEventListener('focus',()=>{if(!viaje)centro(i);});
  el.addEventListener('click',()=>{parar();fijo=i;paths.forEach((x,j)=>x.classList.toggle('foco',j===i));centro(i);});
 });
 $('sectors').addEventListener('pointerleave',()=>{if(!viaje)centro(fijo);});
 function parar(){viaje=0;cartucho.setAttribute('opacity','0');paths.forEach(x=>x.classList.remove('foco'));etiquetaSeguir();}
 function etiquetaSeguir(){$('seguir').textContent=viaje?p('Detener','Stop'):p('Seguir un cartucho','Follow a cartridge');}
 function seguir(){
  if(viaje){parar();centro(fijo);return;}
  fijo=null;const token=viaje=performance.now(),porPaso=reducido.matches?1:650;let ultimo=-1;
  cartucho.setAttribute('opacity','1');etiquetaSeguir();
  const paso=ahora=>{
   if(viaje!==token)return;
   const x=reducido.matches?n:(ahora-token)/porPaso,k=Math.min(n-1,Math.floor(x));
   // El anillo indexa 18° y espera: el cartucho avanza en el primer 30 % del paso y luego se detiene.
   const e=Math.min(1,(x-Math.floor(x))/.3),suave=e*e*(3-2*e),pos=k===0?0:k-1+(x>=n?1:suave),a=ang(pos);
   cartucho.setAttribute('cx',250+190*Math.cos(a));cartucho.setAttribute('cy',250+190*Math.sin(a));
   if(k!==ultimo){ultimo=k;paths.forEach((el,j)=>el.classList.toggle('foco',j===k));centro(k);}
   if(x<n)requestAnimationFrame(paso);
   else{viaje=0;etiquetaSeguir();$('lectura').textContent=p(`Tras ${g.ciclo.soles_total} soles el cartucho vuelve a S1 con su historial completo.`,`After ${g.ciclo.soles_total} sols the cartridge returns to S1 with its full history.`);}
  };
  requestAnimationFrame(paso);
 }
 $('seguir').onclick=seguir;

 // 4 · Calorías: 100 celdas = la energía diaria que necesita la tripulación; huevo y cultivo por separado.
 const trip=D.parametros.mision.tripulacion.valor,porPersona=b.kcal_total/b.cobertura_kcal/trip;
 $('tripulacion').max=trip;$('tripulacion').value=trip;
 function kcal(){
  const m=Number($('tripulacion').value),dem=m*porPersona,h=b.huevo_kcal/dem*100,c=b.cultivo_kcal/dem*100,tot=h+c,celda=Math.round(dem/100);
  $('coverage').textContent=tot.toFixed(2)+'%';
  $('cobertura-texto').textContent=p(`de la energía diaria de ${m===1?'una persona':m+' personas'}, escenario nominal`,`of the daily energy for ${m===1?'one person':m+' people'}, nominal scenario`);
  $('k-huevo').textContent=h.toFixed(2)+'%';$('k-cultivo').textContent=c.toFixed(2)+'%';
  let html='';
  for(let i=0;i<100;i++){
   const a=Math.max(0,Math.min(1,h-i)),ab=Math.max(0,Math.min(1,tot-i));
   const fondo=ab>0?` style="background:linear-gradient(90deg,#bf8238 0 ${a*100}%,#2fa6a0 ${a*100}% ${ab*100}%,#15242e ${ab*100}% 100%)"`:'';
   html+=`<span${fondo} title="${p('Celda','Cell')} ${i+1} · 1 % ≈ ${celda} kcal/${p('día','day')}"></span>`;
  }
  $('waffle').innerHTML=html;
  $('waffle').setAttribute('aria-label',p(`Huevo ${h.toFixed(2)} %, cultivo ${c.toFixed(2)} % de 100 celdas`,`Eggs ${h.toFixed(2)}%, crops ${c.toFixed(2)}% of 100 cells`));
  $('celda-nota').textContent=p(`Cada celda es el 1 % de la energía diaria: ≈ ${celda} kcal. Casi todo lo aporta el huevo.`,`Each cell is 1% of the daily energy: ≈ ${celda} kcal. Eggs provide almost all of it.`);
 }
 $('tripulacion').addEventListener('input',kcal);

 const todo=()=>{comparar();tiempos();centro(fijo);etiquetaSeguir();kcal();paths.forEach((el,i)=>el.setAttribute('aria-label',E[i].codigo+' · '+t(E[i].nombre)));};
 addEventListener('milpa-language',todo);
 if(document.readyState==='loading')addEventListener('DOMContentLoaded',todo);else todo();
})();
</script>
<script>
/* Globo del inicio: una esfera trazada en un solo sombreador (sin three.js) con el mosaico Viking 4K,
   relieve MOLA como mapa de relieve, terminador y halo atmosférico sólo del lado de día.
   Un cuadrilátero por fotograma; se detiene fuera de pantalla. Sin WebGL2 queda la imagen plana. */
(function(){
 const div=document.querySelector('.planet'),M=window.MILPA_MARTE;if(!div||!M)return;
 const cv=document.createElement('canvas'),gl=cv.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:false});if(!gl)return;
 const sh=(tipo,src)=>{const s=gl.createShader(tipo);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;};
 const pr=gl.createProgram();
 gl.attachShader(pr,sh(gl.VERTEX_SHADER,`#version 300 es
in vec2 p;out vec2 v;void main(){v=p;gl_Position=vec4(p,0.,1.);}`));
 gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,`#version 300 es
precision highp float;in vec2 v;out vec4 o;
uniform sampler2D mapa,relieve;uniform float giro;uniform vec3 sol;
const float K=1.12,INC=.44;          // margen para el halo; eje inclinado ~25°
void main(){
 vec2 p=v*K;float r=length(p);
 float g=exp(-abs(r-1.)*30.)*smoothstep(-.35,.6,dot(normalize(vec3(p,0.)),sol))*.7;vec4 halo=vec4(vec3(1.,.64,.44)*g,g);
 if(r>=1.){o=halo;return;}
 vec3 n=vec3(p,sqrt(1.-r*r));float c=cos(INC),s=sin(INC);
 vec3 q=vec3(n.x,c*n.y-s*n.z,s*n.y+c*n.z);
 vec2 st=vec2((atan(q.x,q.z)+giro)/6.2831853+.5,.5-asin(clamp(q.y,-1.,1.))/3.1415927);
 vec2 dx=dFdx(st),dy=dFdy(st);dx.x-=round(dx.x);dy.x-=round(dy.x);st.x=fract(st.x);   // sin costura en el meridiano
 vec3 col=pow(textureGrad(mapa,st,dx,dy).rgb,vec3(2.2));
 float e=1./2048.,h=textureGrad(relieve,st,dx,dy).r,hx=textureGrad(relieve,st+vec2(e,0.),dx,dy).r,hy=textureGrad(relieve,st+vec2(0.,e),dx,dy).r;
 vec3 E=normalize(vec3(q.z,0.,-q.x)+1e-5),N=cross(q,E),qb=normalize(q-2.2*((hx-h)*E-(hy-h)*N));
 vec3 nb=vec3(qb.x,c*qb.y+s*qb.z,-s*qb.y+c*qb.z);
 float dia=smoothstep(-.2,.25,dot(n,sol));
 vec3 luz=col*(max(dot(nb,sol),0.)*2.4+.012)+vec3(1.,.55,.36)*pow(1.-n.z,2.5)*.5*dia;
 float a=smoothstep(1.,.994,r);
 o=vec4(pow(luz/(1.+luz),vec3(1./2.2)),1.)*a+halo*(1.-a);   // el disco se funde en el halo, sin filo oscuro
}`));
 gl.linkProgram(pr);gl.useProgram(pr);
 const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
 const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
 const aniso=gl.getExtension('EXT_texture_filter_anisotropic');
 const textura=(uri,unidad,nombre)=>new Promise((ok,mal)=>{const im=new Image();im.onload=()=>{const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unidad);gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  if(aniso)gl.texParameterf(gl.TEXTURE_2D,aniso.TEXTURE_MAX_ANISOTROPY_EXT,Math.min(8,gl.getParameter(aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
  gl.uniform1i(gl.getUniformLocation(pr,nombre),unidad);ok();};im.onerror=mal;im.src=uri;});
 const uGiro=gl.getUniformLocation(pr,'giro');
 const s=[.8,.36,.48],n=Math.hypot(...s);gl.uniform3f(gl.getUniformLocation(pr,'sol'),s[0]/n,s[1]/n,s[2]/n);
 const quieto=matchMedia('(prefers-reduced-motion: reduce)');
 let visible=true,giro=2.2,antes=0,arrastre=null,inercia=0;
 new IntersectionObserver(([e])=>{visible=e.isIntersecting;if(visible)requestAnimationFrame(pintar);}).observe(div);
 function medir(){const d=Math.min(devicePixelRatio,1.5),w=Math.round(div.clientWidth*1.12*d);if(cv.width!==w){cv.width=cv.height=w;gl.viewport(0,0,w,w);}}
 function pintar(t){
  if(!visible||document.hidden){antes=0;return;}
  const dt=antes?Math.min(.05,(t-antes)/1000):0;antes=t;
  if(!arrastre){giro+=inercia*dt+(quieto.matches?0:dt*.03);inercia*=Math.exp(-dt*2.5);}
  medir();gl.uniform1f(uGiro,giro);gl.drawArrays(gl.TRIANGLES,0,3);
  if(!quieto.matches||Math.abs(inercia)>.01)requestAnimationFrame(pintar);
 }
 // Arrastrar gira el planeta; al soltar conserva el impulso y vuelve al giro lento.
 div.addEventListener('pointerdown',e=>{if(!div.classList.contains('globo'))return;arrastre={x:e.clientX,t:performance.now()};inercia=0;div.setPointerCapture(e.pointerId);});
 div.addEventListener('pointermove',e=>{if(!arrastre)return;const ahora=performance.now(),da=-(e.clientX-arrastre.x)/div.clientWidth*Math.PI;giro+=da;inercia=da/Math.max(.008,(ahora-arrastre.t)/1000);arrastre={x:e.clientX,t:ahora};antes=0;requestAnimationFrame(pintar);});
 const soltar=()=>{if(!arrastre)return;if(performance.now()-arrastre.t>90)inercia=0;arrastre=null;requestAnimationFrame(pintar);};
 div.addEventListener('pointerup',soltar);div.addEventListener('pointercancel',soltar);
 Promise.all([textura(M.color,0,'mapa'),textura(M.relieve,1,'relieve')]).then(()=>{div.classList.add('globo');div.appendChild(cv);requestAnimationFrame(pintar);});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)requestAnimationFrame(pintar);});
 addEventListener('resize',()=>requestAnimationFrame(pintar));
})();
/* Voz: cada sección se narra al llegar a ella, después del primer gesto (el navegador no deja sonar
   antes). Cada proceso del anillo lee su ficha. */
(function(){
 MILPA_ISLA.montar(document.body,{base:'../prototipo-3d/'});
 const pista=()=>MILPA_ISLA.pista(MILPA_I18N.pick('Desplázate: te cuento cada sección','Scroll: each section is narrated'));pista();addEventListener('milpa-language',pista);
 const titular=el=>el.querySelector('h1,h2').textContent;
 let listo=false,actual=null;const dichas=new Set();
 const narrar=sec=>{const id='atlas-'+(sec.id||'inicio');if(!listo||dichas.has(id))return;dichas.add(id);MILPA_ISLA.decir(id,titular(sec));};
 const secciones=[...document.querySelectorAll('main > section')];
 const io=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){actual=e.target;narrar(actual);}},{threshold:.5});
 secciones.forEach(s=>io.observe(s));
 const desbloquear=()=>{if(listo)return;listo=true;document.body.classList.add('voz-lista');if(actual)narrar(actual);};
 addEventListener('pointerdown',desbloquear,{once:true});addEventListener('keydown',desbloquear,{once:true});
 addEventListener('milpa-language',()=>dichas.clear());
 document.querySelectorAll('[data-process]').forEach(el=>el.addEventListener('click',()=>{listo=true;MILPA_ISLA.decir(el.dataset.process,document.querySelector('#detail h3')?.textContent||'');}));
})();
</script></body></html>
